name: Insty 백엔드 CI/CD 파이프라인

on:
  push:
    branches:
      - dev

env:
  ACTOR: ajroot5685
  DOCKER_IMAGE_NAME: ghcr.io/ajroot5685/insty-backend-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot Application
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest -f insty-api/Dockerfile insty-api
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: [ self-hosted, insty-dev ]

    steps:
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ env.ACTOR }} --password-stdin

      - name: Add Private Files
        run: |
          echo "${{ secrets.DEV_APPLICATION_ENV }}" | base64 --decode > .env
          echo "${{ secrets.DEV_DOCKER_COMPOSE }}" | base64 --decode > docker-compose.yml

      - name: Pull latest image and restart via Docker Compose
        run: |
          docker-compose pull
          docker-compose down
          docker-compose up -d

      #      - name: Cleanup Previous Workspace
      #        run: rm -rf ./*

      - name: Cleanup Docker and Cache
        run: |
          docker system prune -af --volumes
          rm -rf ~/.gradle/caches

      - name: Check ping
        run: |
          for i in {1..10}; do
            RESPONSE=$(curl -s localhost:8080)
          
            if echo "$RESPONSE" | grep -q "COMMON_005"; then
              echo "✅ 애플리케이션 실행 완료"
              exit 0
            fi
          
            sleep 3
          done
          
          echo "❌ 애플리케이션 실행 실패"
          exit 1

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          author_name: insty-백엔드 파이프라인
          fields: commit,author,action,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # required