<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>INSTY 알림</title>
    <style>
        .container { max-width: 600px; margin: 0 auto; font-family: Arial, sans-serif; }
        .header { background-color: #f8f9fa; padding: 20px; text-align: center; }
        .content { padding: 30px; line-height: 1.6; }
        .footer { background-color: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #666; }
        .variable-item { margin: 15px 0; padding: 10px; border-left: 3px solid #007bff; }
        .variable-key { font-weight: bold; color: #333; display: inline-block; min-width: 100px; }
        .variable-value { color: #555; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>INSTY</h1>
    </div>
    <div class="content">
        <div th:each="entry : ${allVariables}" class="variable-item">
            <span class="variable-key" th:text="${entry.key}">키</span>:
            <span class="variable-value" th:text="${entry.value}">값</span>
        </div>
    </div>
    <div class="footer">
        <p>본 메일은 발신전용입니다.</p>
        <p>© 2025 INSTY. All rights reserved.</p>
    </div>
</div>
</body>
</html>
