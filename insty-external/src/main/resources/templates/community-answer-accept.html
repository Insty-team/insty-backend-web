<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>답변이 채택되었습니다</title>
    <style>
        body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f7f9fc; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background-color: #9CCD9F; color: white; padding: 24px; text-align: left; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 600; text-shadow: 1px 1px 2px rgba(30, 58, 95, 0.7); }
        .header p { margin: 8px 0 0 0; font-size: 16px; opacity: 0.9; }
        .content { padding: 32px; }
        .notification-title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 24px; }
        .question-info { background-color: #f0f8f1; border-left: 4px solid #9CCD9F; padding: 16px; border-radius: 4px; margin-bottom: 24px; }
        .question-title { font-size: 16px; font-weight: 600; color: #4a6741; margin: 0; }
        .accepted-answer-card { background-color: #fafbfc; border: 2px solid #9CCD9F; border-radius: 6px; padding: 20px; margin-bottom: 24px; }
        .accepted-answer-content { font-size: 14px; color: #1a1a1a; line-height: 1.5; margin-bottom: 16px; }
        .author-info { display: flex; align-items: center; }
        .author-avatar { width: 32px; height: 32px; background-color: #9CCD9F; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; margin-right: 10px; }
        .author-name { font-size: 14px; color: #6b7280; }
        .accepted-label { font-size: 12px; color: #9CCD9F; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .accepted-badge { display: inline-block; background-color: #9CCD9F; color: white; font-size: 10px; padding: 4px 8px; border-radius: 12px; margin-left: 8px; }
        .acceptor-info { background-color: #f8f9fa; border: 1px solid #e4e7ea; border-radius: 6px; padding: 16px; margin-bottom: 24px; }
        .acceptor-label { font-size: 12px; color: #6b7280; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .acceptor-name { font-size: 14px; color: #1a1a1a; font-weight: 500; }
        .cta-button { display: inline-block; background-color: #9CCD9F; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500; margin-top: 24px; transition: background-color 0.2s; }
        .cta-button:hover { background-color: #8bc08f; }
        .footer { background-color: #f7f9fc; padding: 20px 32px; border-top: 1px solid #e4e7ea; }
        .footer p { margin: 0; font-size: 12px; color: #6b7280; }
        .divider { height: 1px; background-color: #e4e7ea; margin: 20px 0; }
        .success-icon { color: #9CCD9F; margin-right: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>INSTY</h1>
        <p>답변 채택 알림</p>
    </div>

    <div class="content">
        <div class="notification-title">
            <span class="success-icon">✓</span>
            <span>질문의 답변이 채택되었습니다</span>
        </div>

        <div class="question-info">
            <div class="question-title" th:text="${questionTitle}">질문 제목</div>
        </div>

        <div class="accepted-answer-card">
            <div class="accepted-label">
                채택된 답변
                <span class="accepted-badge">채택됨</span>
            </div>
            <div class="accepted-answer-content" th:text="${answerContent}">답변 내용</div>
            <div class="author-info">
                <div class="author-avatar" th:text="${#strings.isEmpty(answerAuthorName) ? '?' : #strings.substring(answerAuthorName, 0, 1)}">답</div>
                <span class="author-name" th:text="${(#strings.isEmpty(answerAuthorName) ? '답변자' : answerAuthorName) + ' 님'}">답변자 님</span>
            </div>
        </div>

        <div class="acceptor-info">
            <div class="acceptor-label">채택한 사람</div>
            <div class="acceptor-name" th:text="${(#strings.isEmpty(questionAuthorName) ? '질문 작성자' : questionAuthorName) + ' 님'}">질문 작성자 님</div>
        </div>

        <a th:href="${questionUrl}" class="cta-button">질문 확인하기 →</a>

        <div class="divider"></div>

        <p style="font-size: 14px; color: #6b7280; line-height: 1.5; margin: 0;">
            채택된 답변을 확인하고 다른 질문에도 도움을 주세요!
        </p>
    </div>

    <div class="footer">
        <p>INSTY에서 발송된 알림 메일입니다. 알림 설정은 계정 설정에서 변경하실 수 있습니다.</p>
    </div>
</div>
</body>
</html>
