spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 10000MB

server:
  tomcat:
    max-http-form-post-size: 50MB

swagger:
  server-url: ${SWAGGER_SERVER_URL}

video:
  upload:
    max-minute:
      course: 6000
      answer: 6000
      question: 6000
      community-post: 6000
      community-comment: 6000

mixpanel:
  enabled: false
  token: ""
  verbose: false
  strict: false

aop:
  api-logging:
    enabled: true
