spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

swagger:
  server-url: ${SWAGGER_SERVER_URL}

video:
  upload:
    max-minute:
      course: 6000
      answer: 6000
      question: 6000

mixpanel:
  enabled: false
  token: ""
  verbose: false
  strict: false

aop:
  api-logging:
    enabled: true