spring:
  profiles:
    default: dev

  web:
    resources:
      add-mappings: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5000

  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}


oauth:
  providers:
    kakao:
      endpoints:
        redirect-url: ${KAKAO_REDIRECT_URL}
        token-url: https://kauth.kakao.com/oauth/token
        auth-url: https://kauth.kakao.com/oauth/authorize
        user-info-url: https://kapi.kakao.com/v2/user/me
      client-id: ${KAKAO_CLIENT_ID}



aws:
  region:
    static: ${AWS_REGION}
  s3:
    file:
      bucket: ${AWS_S3_FILE_BUCKET}
      access-key: ${AWS_S3_FILE_ACCESS_KEY}
      secret-key: ${AWS_S3_FILE_SECRET_KEY}
    video:
      upload-bucket: ${AWS_S3_VIDEO_UPLOAD_BUCKET}
      access-key: ${AWS_S3_VIDEO_ACCESS_KEY}
      secret-key: ${AWS_S3_VIDEO_SECRET_KEY}
  cloudfront:
    key-pair-id: ${AWS_CLOUDFRONT_KEY_PAIR_ID}
    private-key-path: ${AWS_CLOUDFRONT_PRIVATE_KEY_PATH}

app:
  domain: ${INSTY_DOMAIN}
  health-check-path: ${HEALTH_CHECK_PATH}

logging:
  level:
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: WARN