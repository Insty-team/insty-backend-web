spring:
  profiles:
    default: dev

  web:
    resources:
      add-mappings: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}


aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
  region:
    static: ${AWS_REGION}
  s3-upload-bucket: ${AWS_S3_UPLOAD_BUCKET}
  s3:
    file:
      bucket: ${AWS_S3_FILE_BUCKET}
      access-key: ${AWS_S3_FILE_ACCESS_KEY}
      secret-key: ${AWS_S3_FILE_SECRET_KEY}

  cloudfront:
    key-pair-id: ${AWS_CLOUDFRONT_KEY_PAIR_ID}
    private-key-path: ${AWS_CLOUDFRONT_PRIVATE_KEY_PATH}

app:
  domain: ${INSTY_DOMAIN}
  health-check-path: ${HEALTH_CHECK_PATH}