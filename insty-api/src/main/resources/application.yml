spring:
  profiles:
    active: prod
  config:
    import:
      - classpath:config/mail.yml

  web:
    resources:
      add-mappings: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 110MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5000

  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}


oauth:
  providers:
    kakao:
      endpoints:
        redirect-url: ${KAKAO_REDIRECT_URL}
        token-url: https://kauth.kakao.com/oauth/token
        auth-url: https://kauth.kakao.com/oauth/authorize
        user-info-url: https://kapi.kakao.com/v2/user/me
      client-id: ${KAKAO_CLIENT_ID}
    naver:
      endpoints:
        redirect-url: ${NAVER_REDIRECT_URL}
        token-url: https://nid.naver.com/oauth2.0/token
        auth-url: https://nid.naver.com/oauth2.0/authorize
        user-info-url: https://openapi.naver.com/v1/nid/me
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
    google:
      endpoints:
        redirect-url: ${GOOGLE_REDIRECT_URL}
        token-url: https://oauth2.googleapis.com/token
        auth-url: https://accounts.google.com/o/oauth2/v2/auth
        user-info-url: https://www.googleapis.com/userinfo/v2/me
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}




aws:
  region: ${AWS_REGION}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    file:
      bucket: ${AWS_S3_FILE_BUCKET}
    video:
      upload-bucket: ${AWS_S3_VIDEO_UPLOAD_BUCKET}
  cloudfront:
    key-pair-id: ${AWS_CLOUDFRONT_KEY_PAIR_ID}
    private-key-path: ${AWS_CLOUDFRONT_PRIVATE_KEY_PATH}

app:
  domain: ${INSTY_DOMAIN}
  health-check-path: ${HEALTH_CHECK_PATH}
  ai-api-secret: ${AI_API_SECRET}

logging:
  level:
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: WARN

video:
  upload:
    max-minute:
      course: 30
      answer: 10
      question: 10

mixpanel:
  token: ${MIXPANEL_TOKEN}
  residency: US
  verbose: true
  strict: true
  enabled: true
  timeoutMillis: 5000